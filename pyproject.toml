[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "soybean-crush-simulator"
version = "0.1.0"
description = "An agent-based soybean market simulator: package and tooling foundation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "pyyaml>=6.0.2,<7",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.41,<2"]

[project.scripts]
soybean-sim = "soybean_sim.cli:app"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.400,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/soybean_sim"]

[tool.ruff]
target-version = "py312"
line-length = 88
cache-dir = ".artifacts/ruff"
extend-exclude = [".artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".artifacts/pytest"
addopts = "--import-mode=importlib --strict-config --strict-markers --cov --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["soybean_sim"]
data_file = ".artifacts/coverage/.coverage"

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = ".artifacts/coverage/html"

[tool.coverage.xml]
output = ".artifacts/coverage/coverage.xml"
